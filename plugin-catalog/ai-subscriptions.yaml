title: AI Subscriptions
description: "Your AI subscriptions and token usage in Hermes Desktop. A page with Overview, Usage and Plans tabs, plus a status-bar chip where you pick which subscriptions to keep. Quota comes from Hermes's own model.options and usage.bars RPCs; token usage covers Hermes, Claude Code and the Grok CLI, and clicking a day shows that day's per-source, per-model and hourly breakdown. Disclosure: read-only reads outside the plugin's data - Hermes state.db and models_dev_cache.json, ~/.claude/projects/**/*.jsonl and ~/.grok/logs/unified.jsonl plus ~/.grok/sessions/*/*/summary.json (token counts only). No credential, .env or auth.json reads, no network calls, no shell commands, no background processes, no telemetry."
