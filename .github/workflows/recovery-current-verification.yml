# Temporary fork-only verification. Remove after results are audited.
name: Current download recovery verification
on:
  push:
    branches:
    - download-recovery
    paths:
    - .github/workflows/recovery-current-verification.yml
permissions:
  contents: read
env:
  RECOVERY_SOURCE_COMMIT: 34cbe0abeb953ef2456510f33eb9ba4fc31f98c6
  RECOVERY_EXPECTED_BUILD: 34cbe0abeb953ef2456510f33eb9ba4fc31f98c6
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: --max-old-space-size=4096
defaults:
  run:
    shell: bash
jobs:
  python-retry:
    name: Required Python failures with ripgrep installed
    if: github.repository == 'ocasta181/hermes-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: 34cbe0abeb953ef2456510f33eb9ba4fc31f98c6
        fetch-depth: 64
    - name: Install the required search executable
      run: "sudo apt-get update\nsudo apt-get install -y ripgrep\ncommand -v rg\n\
        rg --version\n"
    - uses: ./.github/actions/setup-pm
      with:
        extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona",
          "parallel-web"]'
        test-environment: 'true'
        prune-python-cache: true
    - name: Record unchanged source and the exact retry inventory
      run: "mkdir -p \"$RUNNER_TEMP/recovery-suite\"\ngit rev-parse HEAD | tee \"\
        $RUNNER_TEMP/recovery-suite/source.log\"\nrg --version | tee \"$RUNNER_TEMP/recovery-suite/environment.log\"\
        \n\"$HERMES_PYTHON\" scripts/run_tests_parallel.py --generate-slices 2 > \"\
        $RUNNER_TEMP/recovery-suite/inventory.json\"\n"
    - name: Run the three unchanged failed files with the canonical wrapper
      env:
        HERMES_TEST_WORKERS: '2'
        HERMES_TEST_FILE_TIMEOUT: '600'
      run: "/bin/bash scripts/run_tests.sh --files tests/hermes_cli/test_doctor_pm_store_probe.py:tests/tools/test_search_auto_multiline.py:tests/tools/test_search_zero_match_and_multipath.py
        -j 2 2>&1 | tee \"$RUNNER_TEMP/recovery-suite/required-suite.log\"\n"
    - name: Record source custody
      if: always()
      run: "git rev-parse HEAD\ntest \"$(git rev-parse HEAD)\" = \"$RECOVERY_SOURCE_COMMIT\"\
        \ngit diff --exit-code\ngit diff --cached --exit-code\ngit status --porcelain=v1\n"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: recovery-current-python-ripgrep-retry
        path: ${{ runner.temp }}/recovery-suite
        retention-days: 7
